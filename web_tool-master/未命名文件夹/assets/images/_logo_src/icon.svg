<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="chipU" gradientUnits="userSpaceOnUse" x1="246" y1="246" x2="778" y2="778">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- 环绕轨道 -->
  <ellipse cx="512" cy="512" rx="436" ry="150" fill="none" stroke="url(#orbit)" stroke-width="14" stroke-linecap="round" transform="rotate(-22 512 512)"/>

  <!-- 硅芯片主体 -->
  <rect x="312" y="312" width="400" height="400" rx="96" fill="url(#chip)"/>

  <!-- 芯片引脚 -->
  <g stroke="url(#chipU)" stroke-width="30" stroke-linecap="round">
    <line x1="402" y1="246" x2="402" y2="296"/><line x1="512" y1="246" x2="512" y2="296"/><line x1="622" y1="246" x2="622" y2="296"/>
    <line x1="402" y1="728" x2="402" y2="778"/><line x1="512" y1="728" x2="512" y2="778"/><line x1="622" y1="728" x2="622" y2="778"/>
    <line x1="246" y1="402" x2="296" y2="402"/><line x1="246" y1="512" x2="296" y2="512"/><line x1="246" y1="622" x2="296" y2="622"/>
    <line x1="728" y1="402" x2="778" y2="402"/><line x1="728" y1="512" x2="778" y2="512"/><line x1="728" y1="622" x2="778" y2="622"/>
  </g>

  <!-- 内部电路 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M392 512 H452 L492 472 H552"/>
    <path d="M392 592 H472 L512 632 H580"/>
    <path d="M552 392 V440"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="392" cy="512" r="17"/>
    <circle cx="566" cy="472" r="19"/>
    <circle cx="392" cy="592" r="17"/>
    <circle cx="594" cy="632" r="19"/>
    <circle cx="552" cy="392" r="17"/>
  </g>

  <!-- 轨道上的 AI 节点 -->
  <circle cx="894" cy="268" r="24" fill="#06B6D4"/>
  <circle cx="126" cy="742" r="18" fill="#7C3AED"/>
  <circle cx="700" cy="908" r="12" fill="#2563EB"/>

  <!-- 宇宙星光 -->
  <path d="M150 165 l10 25 25 10 -25 10 -10 25 -10 -25 -25 -10 25 -10 z" fill="#FFFFFF"/>
  <path d="M880 820 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8 z" fill="#FFFFFF"/>
  <circle cx="220" cy="860" r="10" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="912" cy="470" r="9" fill="#FFFFFF" opacity="0.7"/>
</svg>
